<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>نظام متابعة الشفتات وأداء المندوبين</title>
    <meta name="description" content="منظومة سحابية متكاملة لإدارة ومتابعة الشفتات وحضور المندوبين وتقييم الأداء بنظام الصلاحيات المتقدم (RBAC) وقاعدة بيانات Firestore ومزامنة Google Sheets" />
    <meta property="og:title" content="نظام متابعة الشفتات وأداء المندوبين" />
    <meta property="og:description" content="منظومة سحابية متكاملة لإدارة ومتابعة الشفتات وحضور المندوبين وتقييم الأداء بنظام الصلاحيات المتقدم (RBAC)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // حماية استدعاءات fetch من تعديلات ملحقات المتصفح غير المتوافقة
      (function() {
        try {
          var nativeFetch = window.fetch;
          var customFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return customFetch; },
            set: function(fn) {
              if (typeof fn === 'function') {
                customFetch = fn;
              }
            }
          });
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-['Cairo',sans-serif]">
    <div id="root"></div>
    <div id="recaptcha-container"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
