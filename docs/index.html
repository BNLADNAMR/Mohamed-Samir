    <script>
      (function () {
        // 1. تحصين خاصية window.fetch عندما تكون معرفة بـ getter فقط (داخل بيئة المعاينة) لمنع انهيار إضافات المتصفح الخارجية
        try {
          var fetchDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (
            fetchDesc &&
            typeof fetchDesc.get === 'function' &&
            typeof fetchDesc.set !== 'function' &&
            fetchDesc.configurable !== false
          ) {
            var origGetter = fetchDesc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: fetchDesc.enumerable !== false,
              get: function () {
                return origGetter.call(window);
              },
              set: function () {
                // تجاهل محاولات إضافات المتصفح الخارجية استبدال window.fetch دون رمي TypeError
              },
            });
          }
        } catch (_err) {}

        function isAbortOrExtensionNoise(input, filename) {
          var src = typeof filename === 'string' ? filename.toLowerCase() : '';
          if (
            src.indexOf('chrome-extension://') === 0 ||
            src.indexOf('moz-extension://') === 0 ||
            src.indexOf('safari-extension://') === 0 ||
            src.indexOf('safari-web-extension://') === 0
          ) {
            return true;
          }
          if (!input) return false;
          var name = typeof input === 'object' && input.name ? String(input.name).toLowerCase() : '';
          var code = typeof input === 'object' && input.code ? input.code : '';
          var stack = typeof input === 'object' && input.stack ? String(input.stack).toLowerCase() : '';
          var msg = typeof input === 'string'
            ? input.toLowerCase()
            : (typeof input === 'object' && input.message ? String(input.message).toLowerCase() : '');

          if (
            msg.indexOf('cannot set property fetch of #<window> which has only a getter') !== -1 ||
            msg.indexOf("cannot assign to read only property 'fetch'") !== -1
          ) {
            return true;
          }
          if (
            (stack.indexOf('chrome-extension://') !== -1 || stack.indexOf('moz-extension://') !== -1) &&
            stack.indexOf(window.location.origin.toLowerCase()) === -1
          ) {
            return true;
          }

          if (msg.indexOf('permission') !== -1 || msg.indexOf('quota') !== -1) return false;
          return (
            name === 'aborterror' ||
            code === 20 ||
            msg.indexOf('the user aborted a request') !== -1 ||
            msg.indexOf('signal is aborted') !== -1 ||
            msg.indexOf('the operation was aborted') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function (e) {
          if (isAbortOrExtensionNoise(e && e.reason, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          if (isAbortOrExtensionNoise(e && (e.error || e.message), e && e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        try {
          var saved = localStorage.getItem('shift_tracker_theme');
          var theme = saved ? JSON.parse(saved) : null;
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script>
      // إذا تم فتح index.html من جذر GitHub Pages مباشرة دون تشغيل Vite، يتم التحويل تلقائياً إلى النسخة المدمجة الجاهزة داخل ./docs/
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && /\.github\.io$/i.test(window.location.hostname) && !/\/docs(\/|$)/.test(window.location.pathname)) {
            var base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
            window.location.replace(base + 'docs/');
          }
        }, 600);
      });
